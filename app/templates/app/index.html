<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem 1rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #fff;
      flex-shrink: 0;
    }

    #upload-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    #drop-zone {
      border: 2px dashed #444;
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }

    #drop-zone:hover, #drop-zone.dragover {
      border-color: #888;
      background: #1a1a1a;
    }

    #drop-zone p {
      color: #888;
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    #drop-zone .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    #file-input { display: none; }

    #progress-section {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1.5rem 0;
      width: 100%;
    }

    #progress-track {
      width: 100%;
      height: 6px;
      background: #2a2a2a;
      border-radius: 3px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 3px;
      transition: width 0.15s ease;
    }

    #progress-label {
      font-size: 0.85rem;
      color: #666;
    }

    #error-msg {
      display: none;
      color: #f87171;
      background: #2a1010;
      border: 1px solid #7f2a2a;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    #result-section {
      display: none;
      flex: 1;
      min-height: 0;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    #result-img {
      flex: 1;
      min-height: 0;
      max-width: 100%;
      width: 100%;
      object-fit: contain;
      border-radius: 8px;
      display: block;
      image-rendering: pixelated;
    }

    #controls {
      flex-shrink: 0;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    #size-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    #slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    #slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 3px #444;
    }

    #slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 0 3px #444;
    }

    .slider-labels {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #666;
    }

    #reset-btn, #download-btn {
      margin-top: 0.5rem;
      background: none;
      border: 1px solid #444;
      color: #aaa;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: border-color 0.2s, color 0.2s;
    }

    #reset-btn:hover {
      border-color: #888;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Pixelator</h1>

  <div id="upload-section">
    <div id="drop-zone">
      <div class="icon">🖼️</div>
      <strong>Drop an image here</strong>
      <p>or click to browse</p>
    </div>
    <input type="file" id="file-input" accept="image/*">

    <div id="progress-section">
      <div id="progress-track"><div id="progress-fill"></div></div>
      <span id="progress-label">Processing… 0%</span>
    </div>

    <div id="error-msg"></div>
  </div>

  <div id="result-section">
    <img id="result-img" alt="Pixelated image">

    <div id="controls">
      <span id="size-label">16px blocks</span>
      <input type="range" id="slider" min="24" max="128" step="4" value="48">
      <div class="slider-labels"><span>24</span><span>128</span></div>
      <div style="display:flex;gap:0.75rem;margin-top:0.5rem">
        <a id="download-btn" href="#" download="pixel-art.jpg"
           style="background:none;border:1px solid #444;color:#aaa;padding:0.5rem 1.25rem;
                  border-radius:6px;cursor:pointer;font-size:0.875rem;text-decoration:none;
                  transition:border-color 0.2s,color 0.2s;"
           onmouseover="this.style.borderColor='#888';this.style.color='#fff'"
           onmouseout="this.style.borderColor='#444';this.style.color='#aaa'">
          Download
        </a>
        <button id="reset-btn">Upload new image</button>
      </div>
    </div>
  </div>

  {% csrf_token %}

  <script>
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    const dropZone      = document.getElementById('drop-zone');
    const fileInput     = document.getElementById('file-input');
    const progressSec   = document.getElementById('progress-section');
    const progressFill  = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const errorMsg      = document.getElementById('error-msg');
    const uploadSec     = document.getElementById('upload-section');
    const resultSec     = document.getElementById('result-section');
    const resultImg     = document.getElementById('result-img');
    const slider        = document.getElementById('slider');
    const sizeLabel     = document.getElementById('size-label');
    const resetBtn      = document.getElementById('reset-btn');
    const downloadBtn   = document.getElementById('download-btn');

    let sessionId = null;

    function updateImage(size) {
      const url = `/media/${sessionId}/${size}.jpg`;
      resultImg.src = url;
      downloadBtn.href = url;
      downloadBtn.download = `pixel-art-${size}px.jpg`;
      sizeLabel.textContent = `${size}px blocks`;
    }

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    resetBtn.addEventListener('click', () => {
      sessionId = null;
      resultSec.style.display = 'none';
      uploadSec.style.display = '';
      dropZone.style.display = '';
      progressSec.style.display = 'none';
      errorMsg.style.display = 'none';
      fileInput.value = '';
    });

    slider.addEventListener('input', () => updateImage(slider.value));

    async function handleFile(file) {
      errorMsg.style.display = 'none';
      dropZone.style.display = 'none';
      progressFill.style.width = '0%';
      progressLabel.textContent = 'Processing… 0%';
      progressSec.style.display = 'flex';

      const formData = new FormData();
      formData.append('image', file);
      formData.append('csrfmiddlewaretoken', csrfToken);

      try {
        const resp = await fetch('/upload/', { method: 'POST', body: formData });

        if (!resp.ok) {
          const data = await resp.json();
          showError(data.error || 'Upload failed');
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.trim()) continue;
            const msg = JSON.parse(line);
            if (msg.done) {
              sessionId = msg.session_id;
              progressSec.style.display = 'none';
              uploadSec.style.display = 'none';
              slider.value = 48;
              updateImage(48);
              resultSec.style.display = 'flex';
              preloadImages(msg.sizes);
            } else {
              const pct = Math.round(msg.progress * 100);
              progressFill.style.width = pct + '%';
              progressLabel.textContent = `Processing… ${pct}%`;
            }
          }
        }
      } catch (err) {
        showError('Network error — please try again');
      }
    }

    function showError(msg) {
      progressSec.style.display = 'none';
      dropZone.style.display = '';
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function preloadImages(sizes) {
      sizes.forEach(size => {
        const img = new Image();
        img.src = `/media/${sessionId}/${size}.jpg`;
      });
    }
  </script>
</body>
</html>
