{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIXELATOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/favicon.png' %}">
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #080808;
        --surface: #0f0f0f;
        --border: #1c1c1c;
        --accent: #b0ff3c;
        --text: #d8d8d8;
        --muted: #3a3a3a;
        --muted-text: #555;
        --danger: #ff4455;
        --font-pixel: "Press Start 2P", monospace;
        --font-mono: ui-monospace, "Courier New", monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-mono);
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ─────────────────────────────────────── */

      header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        height: 52px;
        border-bottom: 1px solid var(--accent);
      }

      #brand {
        font-family: var(--font-pixel);
        font-size: 0.8rem;
        color: var(--accent);
        letter-spacing: 0.04em;
      }

      #tagline {
        font-size: 0.7rem;
        color: var(--muted-text);
        letter-spacing: 0.1em;
      }

      /* ── Main ───────────────────────────────────────── */

      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.5rem 2rem;
      }

      /* ── Upload ─────────────────────────────────────── */

      #upload-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-width: 560px;
        gap: 1rem;
      }

      #drop-zone {
        border: 2px dashed var(--muted);
        padding: 4rem 2rem;
        text-align: center;
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.15s,
          background 0.15s,
          box-shadow 0.15s;
      }

      #drop-zone:hover,
      #drop-zone.dragover {
        border-color: var(--accent);
        background: rgba(176, 255, 60, 0.03);
        box-shadow: 0 0 40px rgba(176, 255, 60, 0.07);
      }

      #drop-zone-prompt {
        font-family: var(--font-pixel);
        font-size: 0.6rem;
        color: var(--text);
        line-height: 2;
        margin-bottom: 1rem;
      }

      #drop-zone-sub {
        font-size: 0.7rem;
        color: var(--muted-text);
        letter-spacing: 0.08em;
      }

      #file-input {
        display: none;
      }

      /* ── Progress ───────────────────────────────────── */

      #progress-section {
        display: none;
        flex-direction: column;
        gap: 0.6rem;
        width: 100%;
      }

      #progress-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      #progress-status {
        font-family: var(--font-pixel);
        font-size: 0.45rem;
        color: var(--accent);
        letter-spacing: 0.1em;
      }

      #progress-pct {
        font-size: 0.7rem;
        color: var(--muted-text);
      }

      #progress-track {
        width: 100%;
        height: 6px;
        background: var(--border);
      }

      #progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.12s linear;
      }

      /* ── Error ──────────────────────────────────────── */

      #error-msg {
        display: none;
        font-family: var(--font-pixel);
        font-size: 0.42rem;
        color: var(--danger);
        border: 1px solid var(--danger);
        padding: 1rem;
        line-height: 2.2;
        letter-spacing: 0.05em;
      }

      /* ── Result ─────────────────────────────────────── */

      #result-section {
        display: none;
        flex: 1;
        min-height: 0;
        width: 100%;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      #result-img {
        flex: 1;
        min-height: 0;
        max-width: 100%;
        width: 100%;
        object-fit: contain;
        display: block;
        image-rendering: pixelated;
      }

      /* ── Controls ───────────────────────────────────── */

      #controls {
        flex-shrink: 0;
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      #controls-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      #size-label {
        font-family: var(--font-pixel);
        font-size: 0.5rem;
        color: var(--accent);
        letter-spacing: 0.06em;
      }

      #controls-hint {
        font-size: 0.65rem;
        color: var(--muted-text);
        letter-spacing: 0.08em;
      }

      #slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        background: var(--border);
        outline: none;
        cursor: pointer;
      }

      #slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 0;
        background: var(--accent);
        cursor: pointer;
      }

      #slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 0;
        background: var(--accent);
        cursor: pointer;
        border: none;
      }

      .slider-bounds {
        display: flex;
        justify-content: space-between;
        font-size: 0.62rem;
        color: var(--muted-text);
      }

      /* ── Buttons ────────────────────────────────────── */

      .btn-row {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 0.35rem;
      }

      .btn {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        background: none;
        border: 1px solid var(--muted);
        color: var(--muted-text);
        padding: 0.5rem 1.1rem;
        cursor: pointer;
        text-decoration: none;
        letter-spacing: 0.06em;
        transition:
          border-color 0.15s,
          color 0.15s;
      }

      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ── Footer ─────────────────────────────────────── */

      footer {
        flex-shrink: 0;
        height: 38px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #footer-text {
        font-size: 0.62rem;
        color: var(--muted-text);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      #footer-text:hover {
        color: var(--text);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="brand"></span>
      <span id="tagline"></span>
    </header>

    <main>
      <div id="upload-section">
        <div id="drop-zone">
          <div id="drop-zone-prompt"></div>
          <div id="drop-zone-sub"></div>
        </div>
        <input type="file" id="file-input" accept="image/*" />

        <div id="progress-section">
          <div id="progress-header">
            <span id="progress-status">PROCESSING</span>
            <span id="progress-pct">0%</span>
          </div>
          <div id="progress-track"><div id="progress-fill"></div></div>
        </div>

        <div id="error-msg"></div>
      </div>

      <div id="result-section">
        <img id="result-img" alt="Pixelated image" />

        <div id="controls">
          <div id="controls-header">
            <span id="size-label"></span>
            <span id="controls-hint">pixel size</span>
          </div>
          <input
            type="range"
            id="slider"
            min="4"
            max="128"
            step="4"
            value="16"
          />
          <div class="slider-bounds"><span>4</span><span>128</span></div>
          <div class="btn-row">
            <a id="download-btn" class="btn" href="#" download="pixel-art.jpg"
              >[ download ]</a
            >
            <button id="reset-btn" class="btn">[ new image ]</button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <a style="text-decoration: none" href="https://www.safarzadehsbeengood.com">
        <span id="footer-text"></span>
      </a>
    </footer>

    {% csrf_token %}

    <script>
      // branding
      const BRAND_NAME = "PIXELATOR";
      const TAGLINE = "@safarzadehsbeengood";
      const FOOTER_TEXT = "© 2026 safarzadehsbeengood";
      const UPLOAD_PROMPT = "[ DROP IMAGE TO BEGIN ]";
      const UPLOAD_SUB = "or click to select a file";

      document.getElementById("brand").textContent = BRAND_NAME;
      document.getElementById("tagline").textContent = TAGLINE;
      document.getElementById("footer-text").textContent = FOOTER_TEXT;
      document.getElementById("drop-zone-prompt").textContent = UPLOAD_PROMPT;
      document.getElementById("drop-zone-sub").textContent = UPLOAD_SUB;
      document.title = BRAND_NAME;

      const csrfToken = document.querySelector(
        "[name=csrfmiddlewaretoken]",
      ).value;

      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("file-input");
      const progressSec = document.getElementById("progress-section");
      const progressFill = document.getElementById("progress-fill");
      const progressPct = document.getElementById("progress-pct");
      const errorMsg = document.getElementById("error-msg");
      const uploadSec = document.getElementById("upload-section");
      const resultSec = document.getElementById("result-section");
      const resultImg = document.getElementById("result-img");
      const slider = document.getElementById("slider");
      const sizeLabel = document.getElementById("size-label");
      const resetBtn = document.getElementById("reset-btn");
      const downloadBtn = document.getElementById("download-btn");

      let sessionId = null;

      function updateImage(size) {
        const url = `/media/${sessionId}/${size}.jpg`;
        resultImg.src = url;
        downloadBtn.href = url;
        downloadBtn.download = `pixel-art-${size}px.jpg`;
        sizeLabel.textContent = `${size}px`;
      }

      dropZone.addEventListener("click", () => fileInput.click());

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });

      dropZone.addEventListener("dragleave", () =>
        dropZone.classList.remove("dragover"),
      );

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
      });

      fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) handleFile(fileInput.files[0]);
      });

      function deleteSession(id) {
        if (!id) return;
        navigator.sendBeacon(
          `/session/${id}/delete/`,
          new URLSearchParams({ csrfmiddlewaretoken: csrfToken }),
        );
      }

      resetBtn.addEventListener("click", () => {
        deleteSession(sessionId);
        sessionId = null;
        resultSec.style.display = "none";
        uploadSec.style.display = "";
        dropZone.style.display = "";
        progressSec.style.display = "none";
        errorMsg.style.display = "none";
        fileInput.value = "";
      });

      window.addEventListener("pagehide", () => deleteSession(sessionId));

      slider.addEventListener("input", () => updateImage(slider.value));

      async function handleFile(file) {
        errorMsg.style.display = "none";
        dropZone.style.display = "none";
        progressFill.style.width = "0%";
        progressPct.textContent = "0%";
        progressSec.style.display = "flex";

        const formData = new FormData();
        formData.append("image", file);
        formData.append("csrfmiddlewaretoken", csrfToken);

        try {
          const resp = await fetch("/upload/", {
            method: "POST",
            body: formData,
          });

          if (!resp.ok) {
            const data = await resp.json();
            showError(data.error || "upload failed");
            return;
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();

            for (const line of lines) {
              if (!line.trim()) continue;
              const msg = JSON.parse(line);
              if (msg.done) {
                sessionId = msg.session_id;
                progressSec.style.display = "none";
                uploadSec.style.display = "none";
                slider.value = 48;
                updateImage(48);
                resultSec.style.display = "flex";
                preloadImages(msg.sizes);
              } else {
                const pct = Math.round(msg.progress * 100);
                progressFill.style.width = pct + "%";
                progressPct.textContent = pct + "%";
              }
            }
          }
        } catch (err) {
          showError("network error — please try again");
        }
      }

      function showError(msg) {
        progressSec.style.display = "none";
        dropZone.style.display = "";
        errorMsg.textContent = "// ERROR: " + msg;
        errorMsg.style.display = "block";
      }

      function preloadImages(sizes) {
        sizes.forEach((size) => {
          new Image().src = `/media/${sessionId}/${size}.jpg`;
        });
      }
    </script>
  </body>
</html>
